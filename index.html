<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MIRU — a manga-styled anime tracker. Track every season, rate them, get recommendations." />
    <meta name="theme-color" content="#f2ede2" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>MIRU · 見る記録</title>
    <script>
      // GitHub Pages lets browsers cache this page for 10 minutes. Right after a deploy, a cached
      // copy points at a script that no longer exists, so reload once, bypassing the cache.
      addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || !/\/assets\//.test(t.src)) return;
        try { if (sessionStorage.getItem('miru:reloaded')) return; sessionStorage.setItem('miru:reloaded', '1'); } catch (_) {}
        location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
