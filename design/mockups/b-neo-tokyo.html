<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRU · Neo-Tokyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060c;--panel:#0d0d18;--pink:#ff2e88;--cyan:#19f0ff;--amber:#ffb000;--dim:#5b5b78;--text:#e7e7f5}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Chakra Petch',sans-serif;overflow-x:hidden}
#rain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 90px}
img{display:block;width:100%;height:100%;object-fit:cover}

header{display:flex;align-items:center;gap:30px;padding:22px 0}
.sign{font:400 30px 'DotGothic16';color:#fff;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 40px var(--pink);animation:flick 6s infinite}
.sign small{font-family:'Chakra Petch';font-weight:700;font-size:15px;letter-spacing:.4em;margin-left:8px;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
@keyframes flick{0%,92%,96%,100%{opacity:1}93%,95%{opacity:.3}}
nav{display:flex;gap:6px}
nav a{color:var(--dim);text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.15em;padding:6px 12px;border:1px solid #1d1d30}
nav a.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(25,240,255,.35) inset}
.term{margin-left:auto;position:relative;width:340px;font-family:'DotGothic16'}
.term input{width:100%;background:#000;border:1px solid var(--pink);color:var(--pink);font:16px 'DotGothic16';padding:10px 12px 10px 30px;outline:none;box-shadow:0 0 14px rgba(255,46,136,.3)}
.term:before{content:'>';position:absolute;left:12px;top:10px;color:var(--pink)}
.results{position:absolute;top:46px;left:0;right:0;background:#000;border:1px solid var(--pink);z-index:5;display:none}
.results.show{display:block}
.results div{display:flex;gap:10px;align-items:center;padding:6px 8px;cursor:pointer}
.results div:hover{background:#1a0612}
.results img{width:32px;height:46px}
.results small{display:block;color:var(--dim)}

.hero{position:relative;height:440px;border:1px solid #20203a;overflow:hidden;margin-top:6px}
.hero img{filter:saturate(1.2) contrast(1.1)}
.hero:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(6,6,12,.95) 0%,rgba(6,6,12,.6) 40%,transparent 70%),linear-gradient(0deg,var(--bg),transparent 40%)}
.hero .info{position:absolute;z-index:2;left:34px;bottom:34px;max-width:560px}
.tag{font:12px 'DotGothic16';color:var(--amber);letter-spacing:.2em}
.hero h1{font:700 52px/1 'Chakra Petch';text-transform:uppercase;margin:8px 0 14px;position:relative}
.glitch:hover{animation:gl .3s steps(2) infinite;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
@keyframes gl{50%{transform:translate(2px,-1px)}}
.prog{display:flex;align-items:center;gap:14px;font:14px 'DotGothic16'}
.prog .bar{width:260px;height:6px;background:#1c1c2e}
.prog .bar span{display:block;height:100%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.btn{display:inline-block;margin-top:18px;background:var(--pink);color:#000;font-weight:700;letter-spacing:.15em;padding:10px 22px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);cursor:pointer}
.neon-v{position:absolute;z-index:2;right:28px;top:24px;writing-mode:vertical-rl;font:400 34px 'DotGothic16';color:#fff;padding:14px 8px;border:2px solid var(--cyan);text-shadow:0 0 10px var(--cyan);box-shadow:0 0 16px rgba(25,240,255,.5),inset 0 0 16px rgba(25,240,255,.3);animation:flick 4.5s infinite;background:rgba(0,0,0,.4)}

h2{font:700 15px 'Chakra Petch';letter-spacing:.35em;margin:60px 0 18px;color:var(--cyan);display:flex;gap:14px;align-items:center}
h2 span{font:13px 'DotGothic16';color:var(--dim);letter-spacing:.1em}
h2:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--cyan),transparent)}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{background:var(--panel);border:1px solid #1d1d30;cursor:pointer;transition:.2s}
.card .im{height:230px;position:relative;overflow:hidden}
.card .im img{transition:.3s}
.card:hover{border-color:var(--pink);box-shadow:0 0 18px rgba(255,46,136,.35);transform:translateY(-4px)}
.card:hover .im img{transform:scale(1.06);filter:drop-shadow(3px 0 0 rgba(255,46,136,.6))}
.card .lbl{padding:10px;font-size:13px}
.card .lbl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--dim)}
.led.watching{background:#3dff8a;box-shadow:0 0 8px #3dff8a}.led.completed{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.led.paused{background:var(--amber);box-shadow:0 0 8px var(--amber)}.led.plan{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.card .lbl .row{display:flex;justify-content:space-between;color:var(--dim);font-family:'DotGothic16'}

/* transit line seasons */
.line{position:relative;background:var(--panel);border:1px solid #1d1d30;padding:40px 40px 30px;display:flex;justify-content:space-between}
.line:before{content:'';position:absolute;left:60px;right:60px;top:118px;height:8px;background:var(--pink);box-shadow:0 0 16px var(--pink)}
.line .ln{position:absolute;left:20px;top:14px;font:12px 'DotGothic16';color:var(--pink)}
.stn{position:relative;text-align:center;width:220px;cursor:pointer}
.stn .nm{height:56px;font-weight:700;font-size:14px;display:flex;align-items:flex-end;justify-content:center}
.stn .yr{font:12px 'DotGothic16';color:var(--dim);margin-bottom:8px}
.stn .dot{width:30px;height:30px;margin:0 auto;border-radius:50%;background:var(--bg);border:6px solid #fff;position:relative;z-index:1}
.stn.here .dot{border-color:var(--cyan);box-shadow:0 0 0 0 var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(25,240,255,0)}}
.stn .here-tag{font:11px 'DotGothic16';color:var(--cyan);margin-top:8px;height:14px}
.seg{display:flex;justify-content:center;gap:14px;margin-top:10px}
.seg div{background:#000;border:1px solid #23233a;padding:6px 10px;font:22px 'DotGothic16';color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.7)}
.seg div.you{color:#3dff8a;text-shadow:0 0 8px rgba(61,255,138,.7)}
.seg small{display:block;font-size:9px;color:var(--dim);text-shadow:none;letter-spacing:.15em}

/* departure board */
.board{background:#000;border:1px solid #23233a;font-family:'DotGothic16';padding:8px 0}
.board .r{display:grid;grid-template-columns:70px 1fr 220px 90px 70px;gap:14px;padding:9px 20px;border-bottom:1px solid #121220;color:var(--amber);align-items:center;animation:flip .5s both}
.board .r.h{color:var(--dim);font-size:12px;animation:none}
.board .r span:nth-child(2){color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .match{color:#3dff8a}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}}
.badge{position:fixed;bottom:14px;right:14px;z-index:11;font:13px 'DotGothic16';color:#000;background:var(--cyan);padding:8px 14px}
@media(max-width:800px){header{flex-wrap:wrap}.term{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.line{flex-direction:column;gap:30px}.line:before{display:none}.board .r{grid-template-columns:50px 1fr 60px}.board .r span:nth-child(3),.board .r span:nth-child(5){display:none}.hero h1{font-size:34px}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <header>
    <div class="sign">ミル<small>MIRU</small></div>
    <nav><a class="on" href="#">LIBRARY</a><a href="#">DISCOVER</a><a href="#">STATS</a></nav>
    <div class="term"><input id="q" placeholder="search_ (try jjk)"><div class="results" id="res"></div></div>
  </header>

  <section class="hero" id="hero"></section>

  <h2>LIBRARY <span>// ライブラリ</span></h2>
  <section class="grid" id="grid"></section>

  <h2>JUJUTSU KAISEN LINE <span>// 呪術線 · each station is a season</span></h2>
  <section class="line" id="line"></section>

  <h2>ARRIVALS <span>// recommended for you</span></h2>
  <section class="board" id="board"></section>
</div>
<div class="badge">MOCKUP B · NEO-TOKYO</div>

<script src="data.js"></script>
<script>
// rain
const cv=document.getElementById('rain'),cx=cv.getContext('2d');let drops=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;drops=Array.from({length:140},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,l:8+Math.random()*16,v:6+Math.random()*8}))}
size();addEventListener('resize',size);
(function fall(){cx.clearRect(0,0,cv.width,cv.height);cx.strokeStyle='rgba(120,160,255,.35)';cx.lineWidth=1;
  for(const d of drops){cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x-1,d.y+d.l);cx.stroke();d.y+=d.v;if(d.y>cv.height){d.y=-20;d.x=Math.random()*cv.width}}
  requestAnimationFrame(fall)})();

loadAnime().then(({lib,seasons,recs})=>{
  const cur=seasons[seasons.length-1],me=ME[113415];
  hero.innerHTML=`<img src="${art(cur)}"><div class="neon-v">${esc((cur.title.native||'').slice(0,6))}</div>
    <div class="info"><div class="tag">▶ NOW PLAYING · SEASON ${seasons.length}</div><h1 class="glitch">${esc(T(cur))}</h1>
    <div class="prog">EP ${me.ep}/${cur.episodes||'?'}<div class="bar"><span style="width:${me.ep/(cur.episodes||12)*100}%"></span></div>★ ${S(cur)}</div>
    <div class="btn">CONTINUE EP ${me.ep+1}</div></div>`;

  grid.innerHTML=lib.map(m=>{const u=ME[m.id];return `<div class="card"><div class="im"><img src="${m.coverImage.extraLarge}"></div>
    <div class="lbl"><b>${esc(T(m))}</b><div class="row"><span><i class="led ${u.status}"></i>${u.status==='plan'?'QUEUED':'S'+seasonOf(m)+(u.ep?' E'+u.ep:'')}</span><span>★${S(m)}</span></div></div></div>`}).join('');

  line.innerHTML=`<span class="ln">LINE 呪 · ${seasons.length} STATIONS</span>`+seasons.map((s,i)=>{const here=i===seasons.length-1,mine=me.mine[i];
    return `<div class="stn ${here?'here':''}"><div class="nm">${esc(T(s))}</div><div class="yr">S${i+1} · ${s.seasonYear||'TBA'}</div><div class="dot"></div>
    <div class="here-tag">${here?'▲ YOU ARE HERE':''}</div>
    <div class="seg"><div>${S(s)}<small>CROWD</small></div><div class="you">${mine??'--'}<small>YOU</small></div></div></div>`}).join('');

  board.innerHTML=`<div class="r h"><span>YEAR</span><span>DESTINATION</span><span>GENRE</span><span>MATCH</span><span>SCORE</span></div>`+
    recs.slice(0,8).map((m,i)=>`<div class="r" style="animation-delay:${i*.08}s"><span>${m.seasonYear||'----'}</span><span>${esc(T(m)).toUpperCase()}</span><span>${esc(m.genres.slice(0,2).join(' / '))}</span><span class="match">${96-i*4}%</span><span>${S(m)}</span></div>`).join('');
}).catch(e=>hero.innerHTML=`<div class="info">AniList offline: ${esc(e.message)}</div>`);

q.addEventListener('input',debounce(async()=>{
  const r=await searchAnime(q.value).catch(()=>[]);
  res.innerHTML=r.map(m=>`<div><img src="${m.coverImage.large}"><span>${esc(T(m))}<small>${m.seasonYear||''} · ${m.format||''} · ★${S(m)}</small></span></div>`).join('');
  res.classList.toggle('show',r.length>0);
}));
</script>
</body>
</html>
